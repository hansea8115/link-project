<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 링크 모음</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CSV 파싱을 위한 PapaParse CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 min-h-[100dvh] pb-10">
  <div class="max-w-md mx-auto bg-white min-h-[100dvh] shadow-sm">
    <!-- 상단 프로필 영역 -->
    <header class="pt-10 pb-6 text-center">
      <h1 class="text-2xl font-bold text-gray-900">내 브랜드</h1>
      <p class="text-gray-500 mt-2 text-sm">원하는 카테고리를 선택해보세요</p>
    </header>

    <!-- 카테고리 탭 렌더링 영역 -->
    <nav id="category-tabs" class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide py-4 px-4 gap-3 border-b border-gray-100"></nav>

    <!-- 상품/링크 리스트 렌더링 영역 -->
    <main id="product-list" class="flex flex-col gap-4 p-4"></main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
